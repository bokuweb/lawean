[package]
name = "lawean-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "lawean-check for the browser playground (wasm-bindgen)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lawean-check = { path = "../lawean-check" }
lawean-extract = { path = "../lawean-extract" }
lawean-source = { path = "../lawean-source" }
lawean-amend = { path = "../lawean-amend" }
lawean-verify = { path = "../lawean-verify" }
lawean-semantic = { path = "../lawean-semantic" }
lawean-resolve = { path = "../lawean-resolve" }
serde_json.workspace = true
wasm-bindgen = "0.2"
