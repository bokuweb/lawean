[package]
name = "lawean-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The check API a drafting service calls: parse 改め文, bind to the base revision, consolidate, and report 発射台 / ハネ / 衝突 / 順序 / 新旧対照表 / 他法令 problems"

[dependencies]
lawean-source = { path = "../lawean-source" }
lawean-resolve = { path = "../lawean-resolve" }
lawean-amend = { path = "../lawean-amend" }
lawean-space = { path = "../lawean-space" }
lawean-render = { path = "../lawean-render" }
lawean-leanrt = { path = "../lawean-leanrt", optional = true }
lawean-extract = { path = "../lawean-extract" }
serde.workspace = true
serde_json.workspace = true

[features]
default = ["lean"]
# 証明した Lean の applyUnit（C 経由）で溶け込みを計算する。無ければ Rust の写し（結果は同じ。テストで三者一致）
lean = ["dep:lawean-leanrt"]

[dev-dependencies]
lawean-extract = { path = "../lawean-extract" }
lawean-verify = { path = "../lawean-verify" }
