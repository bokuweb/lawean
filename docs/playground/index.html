<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>lawean 改正案の検査 playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="playground.css">
</head>
<body>
<header>
  <h1>改正案の検査 playground</h1>
  <span class="sub"><a href="draft.html"><b>発射台を選んで改正法を書く playground はこちら</b></a>。実際の改正（成功例）と、そこから作った失敗例を、改め文を書き換えながら試す。判定は Rust の <code>lawean-check</code> の WASM。溶け込みは <b>Lean の C 出力を WASM にした証明済みの <code>applyUnit</code></b> で計算する（ADR-0017）。<a href="../design-notes.html">設計</a> / <a href="../playground.html">identity patch の playground</a></span>
</header>
<main>
  <section class="left">
    <label for="case">ケース（fixtures/cases/cases.json）</label>
    <select id="case"></select>
    <p class="case-note" id="note"></p>
    <div class="row">
      <div>
        <label for="base">発射台（改正前のリビジョン、e-Gov）</label>
        <select id="base"></select>
      </div>
      <div>
        <label for="expected">改正後のリビジョン（あれば突き合わせる）</label>
        <select id="expected"></select>
      </div>
    </div>
    <label for="amend">改め文（編集できる）</label>
    <textarea id="amend" spellcheck="false"></textarea>
    <label for="taisho">新旧対照表（任意。1 行 1 項: <code>新 第三十八条第五項　本文</code> / <code>旧 第三十八条第三項　本文</code>）</label>
    <textarea id="taisho" class="small" spellcheck="false"></textarea>
    <div class="row">
      <div>
        <label for="laws">他法令（波及を見る。複数選択）</label>
        <select id="laws" multiple size="4"></select>
      </div>
      <div>
        <label for="enforced">施行日</label>
        <input id="enforced" placeholder="YYYY-MM-DD">
      </div>
    </div>
    <button id="run">検査する</button>
    <button id="reset" class="secondary">ケースの改め文に戻す</button>
    <span class="status" id="status"></span>
  </section>
  <section class="right">
    <div id="report"><p class="status">ケースを選んで「検査する」。</p></div>
  </section>
</main>
<script type="module">
import { setup, load, fill, $, esc, KIND_JA, renderReport, check } from './common.js';
let lastBaseXml = '';
const REVISIONS = [
  ['revisions/403AC0000000090_20170602_429AC0000000045.xml', '2017-06-02（平成29年法律第45号）'],
  ['revisions/403AC0000000090_20200401_429AC0000000045.xml', '2020-04-01（同）'],
  ['revisions/403AC0000000090_20210519_503AC0000000037.xml', '2021-05-19（令和3年法律第37号の発射台）'],
  ['revisions/403AC0000000090_20220518_503AC0000000037.xml', '2022-05-18（令3-37 第35条 施行後）'],
  ['revisions/403AC0000000090_20220525_504AC0000000048.xml', '2022-05-25（令4-48 1 段目。本則は同じ）'],
  ['revisions/403AC0000000090_20230220_504AC0000000048.xml', '2023-02-20（令4-48 第73条 施行後）'],
  ['revisions/403AC0000000090_20230614_505AC0000000053.xml', '2023-06-14（令5-53 1 段目。本則は同じ）'],
  ['403AC0000000090.xml', '2026-05-21 現行（令4-48 第74条 施行後）'],
  ['revisions/403AC0000000090_20280613_505AC0000000053.xml', '2028-06-13（令5-53 条ずれ。未対応）'],
  ['revisions/325AC1000000100_20180620_430AC0000000059.xml', '公職選挙法 2018-06-20（平30-75 の発射台）'],
  ['revisions/325AC1000000100_20181025_430AC0100000075.xml', '公職選挙法 2018-10-25（平30-75 施行後、罰則の引用が残る）'],
  ['revisions/325AC1000000100_20201212_502AC1000000045.xml', '公職選挙法 2020-12-12（令3-51 の発射台）'],
  ['revisions/325AC1000000100_20210602_503AC0000000051.xml', '公職選挙法 2021-06-02（令3-51 施行後）'],
];
const LAWS = [
  ['laws/413AC0000000026_20220518_503AC0000000037.xml', '高齢者の居住の安定確保に関する法律（2022-05-18）'],
  ['laws/413AC0000000026_20210519_503AC0000000037.xml', '同（2021-05-19）'],
  ['laws/504CO0000000187.xml', '借地借家法施行令（2022-05-18）'],
  ['laws/504M60000010029.xml', '借地借家法施行規則'],
  ['laws/425AC0000000061.xml', '大規模災害借地借家特別措置法'],
];
const LEAN = {
  'r3-37-art35': 'Consolidate.lean: consolidates_503AC0000000037_art35, wf_503AC0000000037_art35',
  'r4-48-art73': 'Consolidate.lean: consolidates_504AC0000000048_art73',
  'r4-48-art73-74': 'Consolidate.lean: consolidates_504AC0000000048_art73_74, art74_depends_on_art73, schedule_504AC0000000048',
  'r3-37-then-r4-48-art73': 'Consolidate.lean: independent_art35_art73 → art35_art73_commute（applyUnit_comm）, both_orders_reach_20230220',
  'wrong-base': 'Consolidate.lean: art35_on_wrong_base_conflicts（発射台がずれると衝突として残る）',
  'r4-48-reversed': 'Consolidate.lean: art74_before_art73_fails（applyUnit … = none）, schedule_504AC0000000048',
  'hane-missing': 'Cases.lean: hane_missing_differs（溶け込みはするが e-Gov と一致しない）。RefsExamples.lean: hane_fixes_are_in_the_real_amendment（生成した手当て = 実際の改め文の置換）',
  'hane-wrong-number': 'RefsExamples.lean: hane_fixes_38（正しい手当ては「第三項」）。Refs.lean: hane_complete（描画が変わるのは参照先の番号が動いたときだけ）',
  'wrong-ref': 'Rust の束縛（bind）で止まる。Lean には id 操作が届かない',
  'taisho-wrong': 'Rust の突き合わせ。Lean の対象外（資料の検査）',
  'conflict-22': 'Cases.lean: conflict_22_has_conflict（Node.conflicts に値として残る）',
  'delete-28-dangling': 'Space.lean / SpaceExamples.lean: delete_28_leaves_b58_dangling',
  'insert-article-wrong-number': 'Rust の連番の検査（lawean-amend::numbering）。溶け込みは Lean、番号の列は溶け込み後の Revision の art から',
  'enforced-out-of-range': 'Rust の規則（附則第一条の読み）と暦。暦が Z3 の暦（lawean-verify::temporal）と一致することは lawean-verify のテスト',
  'h30-75-koshoku-senkyo': 'Penalty は Rust の規則（罰則の行為 vs 対象規定）。Koshoku.lean: generated_fix_is_the_2021_correction（生成した手当て = 令和3年法律第51号の replace）, h30_75_does_not_touch_244',
  'r3-51-koshoku-senkyo-fix': 'Koshoku.lean: consolidates_503AC0000000051（本則 1167 項が e-Gov と一致）',
};

let cases = [];
let current = null;

async function selectCase(id) {
  current = cases.find(c => c.id === id);
  if (!current) return;
  $('note').innerHTML = `<b>${current.kind === 'success' ? '成功例' : '失敗例'}</b> — ${current.note || ''}<br><span>出典: ${current.source || ''}</span>`;
  $('base').value = current.base;
  $('expected').value = current.expected || '';
  $('amend').value = await load(current.amendment);
  $('taisho').value = current.taisho ? await load(current.taisho) : '';
  for (const o of $('laws').options) o.selected = (current.other_laws || []).includes(o.value);
  $('enforced').value = current.enforced || '';
  $('report').innerHTML = '<p class="status">「検査する」で判定。期待: ' + (current.expect.ok ? 'すべて通る' : '落ちるのは ' + current.expect.fail.map(k => KIND_JA[k]).join('・')) + '</p>';
}

async function run() {
  $('status').textContent = '検査中…';
  try {
    const base = await load($('base').value);
    const expected = $('expected').value ? await load($('expected').value) : null;
    const other_laws = await Promise.all([...$('laws').selectedOptions].map(o => load(o.value)));
    const input = { base, amendment: $('amend').value, expected, taisho: $('taisho').value.trim() || null, other_laws, enforced: $('enforced').value || null };
    const t0 = performance.now();
    lastBaseXml = base;
    const report = JSON.parse(check(JSON.stringify(input)));
    render(report, performance.now() - t0);
  } catch (e) {
    $('report').innerHTML = `<p class="verdict fail">エラー</p><pre>${String(e)}</pre>`;
  }
  $('status').textContent = '';
}


function render(r, ms) {
  const expect = current ? (r.ok === current.expect.ok && JSON.stringify(r.checks.filter(c => c.status === 'fail').map(c => c.kind)) === JSON.stringify(current.expect.fail)) : null;
  const note = expect === null ? '' : expect ? '・ケースの期待どおり' : '・ケースの期待と違う（改め文を編集した？）';
  const extra = current && LEAN[current.id] ? `<p class="lean">Lean 側の対応: <code>${esc(LEAN[current.id])}</code></p>` : '';
  $('report').innerHTML = renderReport(r, ms, { note, extra, baseXml: lastBaseXml });
}

(async () => {
  await setup();
  fill($('base'), REVISIONS, false);
  fill($('expected'), REVISIONS, true);
  fill($('laws'), LAWS, false);
  cases = JSON.parse(await load('cases/cases.json'));
  const sel = $('case');
  for (const kind of ['success', 'failure']) {
    const g = document.createElement('optgroup');
    g.label = kind === 'success' ? '成功例（実際の改正）' : '失敗例（実際に起きたもの・実際の改め文から作ったもの）';
    for (const c of cases.filter(c => c.kind === kind)) g.append(new Option(c.title, c.id));
    sel.append(g);
  }
  sel.onchange = () => selectCase(sel.value);
  $('run').onclick = run;
  $('reset').onclick = () => selectCase(sel.value);
  const hash = location.hash.slice(1);
  sel.value = cases.some(c => c.id === hash) ? hash : cases[0].id;
  await selectCase(sel.value);
})();
</script>
</body>
</html>
